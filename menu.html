<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Feliz Aniversario!</title>
    <style>
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 50%, #f3e5f5 100%);
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
            min-height: 100vh;
            background-attachment: fixed;
        }

        .navbar {
            background: linear-gradient(90deg, #7b1fa2, #9c27b0, #4a148c);
            padding: 20px 0;
            box-shadow: 0 2px 10px rgba(216, 27, 96, 0.3);
        }

        .navbar ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .navbar li {
            margin: 0 15px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 18px;
            padding: 12px 25px;
            border-radius: 25px;
            transition: all 0.3s ease;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .navbar a:hover {
            background-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .menu-container {
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: linear-gradient(145deg, #ffffff, #f8f8f8);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            max-width: 700px;
            animation: fadeIn 1.2s ease-in-out;
            border: 2px solid rgba(216, 27, 96, 0.1);
        }

        .card h2 {
            color: #7b1fa2;
            font-size: 2.5em;
            margin-bottom: 25px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            font-family: 'Georgia', serif;
        }

        .card p {
            line-height: 1.8;
            font-size: 1.2em;
            color: #555;
            text-align: justify;
            margin-bottom: 20px;
        }

        .card .firma {
            margin-top: 30px;
            font-style: italic;
            font-size: 1.3em;
            color: #7b1fa2;
            font-weight: bold;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ✨ Botón de volver */
        .back-button {
            margin-top: 40px;
            display: inline-block;
            background: linear-gradient(45deg, #7b1fa2, #9c27b0);
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(216, 27, 96, 0.3);
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(216, 27, 96, 0.4);
            background: linear-gradient(45deg, #4a148c, #7b1fa2);
        }
    </style>
</head>

<body class="menu-body">
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="menu.html">Inicio</a></li>
                <li><a href="NiñaBonita.html">Mensajes Especiales</a></li>
            </ul>
        </nav>
    </header>
    <main class="menu-container">
        <div class="card">
            <!-- Video de BTS que se reproduce automáticamente -->
            <video autoplay loop controls
                style="width: 100%; max-width: 500px; border-radius: 15px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);">
                <source src="BTS_CUMPLE.mp4" type="video/mp4">
                Tu navegador no soporta el elemento de video.
            </video>

            <h2>💜 ¡FELIZ CUMPLEAÑOS! 💜</h2>
            <p style="font-size: 1.5em; font-weight: bold; text-align: center; color: #7b1fa2;">
                CLARITA LISBETH CHAPOÑAN SIESQUEN
            </p>
            <p>
                ✨ Que este día tan especial esté lleno de alegría, música, sorpresas y momentos inolvidables. Te
                deseamos lo mejor hoy y siempre. ✨
            </p>
            <p>
                💜 ¡Disfruta mucho tu día! 💜
            </p>
        </div>
    </main>

    <script>
        // Intentar reproducir el video forzadamente para lidiar con políticas de navegadores
        document.addEventListener("DOMContentLoaded", function () {
            var video = document.querySelector("video");
            if (video) {
                video.play().catch(function (error) {
                    console.log("El autoplay con sonido fue bloqueado por el navegador. El usuario debe interactuar.");
                });
            }
        });
    </script>
</body>

</html>
